# Optional replacement for render.yaml when deploying the persistent team library.
# Requires paid Render compute and a persistent disk. Does not deploy itself.
services:
  - type: web
    name: damage-agent
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: team-data
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TEAM_DB_PATH
        value: /app/storage/teams.sqlite3
